{% extends 'base.html' %}

{% block content %}

<div class="row mt-4">
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        <span class="mb-4 d-block" style="font-size: 1.1rem;">Logged in as <b class="text-info">{{ user }}</b></span>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-warning text-dark text-center text-uppercase font-weight-bold border-0 py-3">All Categories</div>
                    <div class="card-body text-dark d-flex align-items-center justify-content-center">
                        <h1 class="card-title text-center display-4 m-0 font-weight-bold">{{ category_count }}</h1>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-info text-white text-center text-uppercase font-weight-bold border-0 py-3">All Posts</div>
                    <div class="card-body text-dark d-flex align-items-center justify-content-center">
                        <h1 class="card-title text-center display-4 m-0 font-weight-bold">{{ blogs_count }}</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
